<ion-header>
  <ion-toolbar>
    <ion-row (click)="core.navigate('/')">
      <ion-thumbnail class="ion-margin-start">
        <img src="assets/icon/favicon.png" alt="">
      </ion-thumbnail>
      <ion-title>
        Olive Farming
      </ion-title>
    </ion-row>

    <ion-buttons slot="end">
      @if (!core.isLoggedIn) {
        <ion-button (click)="core.navigate('/auth/login')">
          Log in <ion-icon name="log-in-outline"></ion-icon>
        </ion-button>
      }

      @if (core.isLoggedIn) {
        <ion-button (click)="presentPopover($event)">
          <ion-icon name="person-circle-outline" size="large"></ion-icon>
        </ion-button>

        <ion-popover #popover [isOpen]="isPopoverOpen" [event]="popoverEvent" (didDismiss)="isPopoverOpen = false" side="bottom" alignment="center">
          <ng-template>
            <ion-content class="ion-padding-horizontal">
              <h4>¡Hola, {{core.user.name}} {{core.user.surname}}!</h4>
              <hr>
              <div class="logoutDiv">
                <ion-button (click)="logout()" fill="clear">
                  <ion-icon name="power-outline" size="medium"></ion-icon>
                  <span>&nbsp;Cerrar sesión</span>
                </ion-button>
              </div>
            </ion-content>
          </ng-template>
        </ion-popover>
      }

    </ion-buttons>
  </ion-toolbar>
</ion-header>
