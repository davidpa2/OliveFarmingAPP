<app-navbar></app-navbar>

<ion-content color="light">
  <div class="page-container">

    @if (isLoading()) {
      <!-- Skeleton account card -->
      <ion-card class="animation-fade-in ion-margin-top" style="border-radius: 12px;">
        <ion-item lines="none" class="ion-padding-vertical">
          <ion-skeleton-text [animated]="true" slot="start" style="width: 48px; height: 48px; border-radius: 50%;"></ion-skeleton-text>
          <ion-label>
            <ion-skeleton-text [animated]="true" style="width: 50%; height: 20px; border-radius: 4px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 70%; height: 14px; border-radius: 4px; margin-top: 6px;"></ion-skeleton-text>
          </ion-label>
        </ion-item>
      </ion-card>

      <!-- Skeleton CUE Form -->
      <ion-card class="form-card animation-fade-in ion-margin-top">
        <ion-card-header>
          <ion-skeleton-text [animated]="true" style="width: 60%; height: 24px; border-radius: 4px;"></ion-skeleton-text>
        </ion-card-header>
        <ion-card-content>
          <ion-row>
            @for (i of [1, 2, 3, 4, 5]; track i) {
              <ion-col size="12" size-md="6">
                <ion-skeleton-text [animated]="true" style="width: 100%; height: 52px; border-radius: 26px; margin-bottom: 8px;"></ion-skeleton-text>
              </ion-col>
            }
          </ion-row>
        </ion-card-content>
      </ion-card>

    } @else {

      <!-- Account data -->
      @if (userInfo(); as user) {
        <ion-card class="animation-fade-in ion-margin-top" style="border-radius: 12px;">
          <ion-item lines="none" class="ion-padding-vertical">
            <ion-icon name="person-circle" color="primary" slot="start" style="font-size: 48px;"></ion-icon>
            <ion-label>
              <h2 style="font-weight: 700; font-size: 1.2rem; margin-bottom: 2px;">
                {{ user.name }} {{ user.surname }}
              </h2>
              <p style="color: var(--ion-color-medium);">{{ user.email }}</p>
            </ion-label>
          </ion-item>
        </ion-card>
      }

      <!-- CUE Form -->
      <ion-card class="form-card animation-slide-down ion-margin-top">
        <ion-card-header>
          <ion-card-title color="primary">Datos de Explotación (CUE)</ion-card-title>
          <ion-card-subtitle>Se incluirán automáticamente al exportar tu cuaderno mensual</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
            
            <ion-row>
              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="holderName" label="Titular de la Explotación"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="business-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>

              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="holderNif" label="NIF del Titular"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="id-card-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col size="12">
                <ion-input type="text" formControlName="reafaNumber" label="Nº Inscripción REAFA"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="document-text-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="applicatorName" label="Nombre del Aplicador"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="person-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>

              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="applicatorNif" label="NIF del Aplicador"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="card-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="ropoNumber" label="Nº Carnet / Inscripción ROPO"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="ribbon-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>

              <ion-col size="12" size-md="6">
                <ion-input type="text" formControlName="equipmentRoma" label="Nº ROMA Equipo (Cuba)"
                  labelPlacement="floating" fill="outline" shape="round">
                  <ion-icon slot="end" name="construct-outline" color="primary"></ion-icon>
                </ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col size="12" size-md="6">
                <ion-input id="iteafDatePopover" [value]="profileForm.get('lastIteafDate')?.value | date:'dd/MM/yyyy'"
                  type="text" label="Fecha última inspección ITEAF" labelPlacement="floating"
                  readonly fill="outline" shape="round">
                  <ion-icon slot="end" name="calendar-outline" color="primary"></ion-icon>
                </ion-input>
                <ion-popover trigger="iteafDatePopover" alignment="center">
                  <ng-template>
                    <ion-datetime
                      presentation="date"
                      [formControl]="$any(profileForm.get('lastIteafDate'))">
                    </ion-datetime>
                  </ng-template>
                </ion-popover>
              </ion-col>
            </ion-row>

            <div class="action-buttons ion-margin-top">
              <ion-button shape="round" type="submit" [disabled]="isSaving()">
                @if (isSaving()) {
                  <ion-spinner name="dots"></ion-spinner>
                } @else {
                  <ion-icon slot="start" name="save-outline"></ion-icon>
                  Guardar datos
                }
              </ion-button>
            </div>

          </form>
        </ion-card-content>
      </ion-card>

    }
  </div>
</ion-content>
